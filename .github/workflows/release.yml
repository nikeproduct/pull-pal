name: Release

# Manual releasing is what produced v0.1's worst distribution defects: a
# Homebrew tap that was never created, a PyPI package that was never published,
# and a build path that could ship a binary reporting the wrong version. Every
# remaining channel — GitHub Releases, npm, Homebrew — is automated and verified
# here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      # The same code the build job below publishes.
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: Build release artifacts
    needs: verify
    # Built on macOS so the Homebrew tarballs are produced by the same job that
    # publishes them, and `tar` is guaranteed present.
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha_arm64: ${{ steps.hashes.outputs.arm64 }}
      sha_x64: ${{ steps.hashes.outputs.x64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run names an existing tag; build from it, not from the branch.
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Confirm the tag matches the manifests
        id: version
        run: |
          set -euo pipefail
          bun run check-version
          VERSION=$(node -p "require('./package.json').version")
          # On a manual run the ref is a branch, so the tag comes from the input.
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Assert the tarballs are Homebrew-installable
        run: |
          set -euo pipefail
          for arch in darwin-arm64 darwin-x64; do
            members=$(tar -tzf "dist/tarballs/pull-pal-$arch.tar.gz")
            if [ "$members" != "pull-pal" ]; then
              echo "pull-pal-$arch.tar.gz must contain exactly 'pull-pal', got: $members" >&2
              exit 1
            fi
          done

      - name: Collect tarball hashes for the formula
        id: hashes
        run: |
          set -euo pipefail
          cd dist/tarballs
          echo "arm64=$(shasum -a 256 pull-pal-darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 pull-pal-darwin-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/pull-pal-*
            dist/tarballs/*.tar.gz
            dist/SHA256SUMS
            npm-packages/

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            dist/pull-pal-* dist/tarballs/*.tar.gz dist/SHA256SUMS

  npm:
    name: Publish to npm
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run names an existing tag; build from it, not from the branch.
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - run: bun install --frozen-lockfile
      - name: Publish platform packages, then the shim
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run scripts/publish-npm.ts

  homebrew:
    name: Update the Homebrew tap
    needs: [build, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run names an existing tag; build from it, not from the branch.
          ref: ${{ inputs.tag || github.ref }}

      - name: Render the formula for this release
        run: |
          set -euo pipefail
          sed -e "s/^  version \".*\"/  version \"${{ needs.build.outputs.version }}\"/" \
              -e "s/REPLACED_ON_RELEASE_DARWIN_ARM64/${{ needs.build.outputs.sha_arm64 }}/" \
              -e "s/REPLACED_ON_RELEASE_DARWIN_X64/${{ needs.build.outputs.sha_x64 }}/" \
              Formula/pull-pal.rb > /tmp/pull-pal.rb
          grep -q REPLACED_ON_RELEASE /tmp/pull-pal.rb && exit 1 || true

      - name: Open a PR against the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/nikeproduct/homebrew-pull-pal.git" tap
          cd tap
          mkdir -p Formula
          cp /tmp/pull-pal.rb Formula/pull-pal.rb
          git config user.name "pull-pal release bot"
          git config user.email "noreply@github.com"
          git checkout -b "release-${{ needs.build.outputs.version }}"
          git add Formula/pull-pal.rb
          git commit -m "pull-pal ${{ needs.build.outputs.version }}"
          git push -u origin "release-${{ needs.build.outputs.version }}"
          gh pr create --fill --base main

  smoke:
    name: Install from npm (${{ matrix.os }})
    # `build` must be a direct dependency: the needs context only exposes the
    # outputs of jobs listed here, and this job pins installs to its version.
    needs: [build, npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Installing from the real registry is the only check that proves a
      # release is actually usable, rather than merely uploaded.
      - name: Wait for registry propagation
        run: sleep 60

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install and run
        run: |
          npm install -g pull-pal@${{ needs.build.outputs.version }}
          pull-pal --version
          pull-pal --help
