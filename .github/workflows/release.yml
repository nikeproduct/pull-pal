name: Release

# Manual releasing is what produced v0.1's worst distribution defects: a
# package tap that was never created, a PyPI package that was never published,
# and a build path that could ship a binary reporting the wrong version. npm is
# the one install channel; it and the GitHub Release (binaries + SHA256SUMS) are
# automated and verified here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      # The same code the build job below publishes.
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: Build release artifacts
    needs: verify
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run names an existing tag; build from it, not from the branch.
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Confirm the tag matches the manifests
        id: version
        run: |
          set -euo pipefail
          bun run check-version
          VERSION=$(node -p "require('./package.json').version")
          # On a manual run the ref is a branch, so the tag comes from the input.
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/pull-pal-*
            dist/SHA256SUMS
            npm-packages/

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            dist/pull-pal-* dist/SHA256SUMS

  npm:
    name: Publish to npm
    # Not gated on the GitHub Release: npm is the install channel, and a hiccup
    # creating the release must not hold it back.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run names an existing tag; build from it, not from the branch.
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - run: bun install --frozen-lockfile
      - name: Publish platform packages, then the shim
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run scripts/publish-npm.ts

  smoke:
    name: Install from npm (${{ matrix.os }})
    # `build` must be a direct dependency: the needs context only exposes the
    # outputs of jobs listed here, and this job pins installs to its version.
    needs: [build, npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Installing from the real registry is the only check that proves a
      # release is actually usable, rather than merely uploaded.
      - name: Wait for registry propagation
        run: sleep 60

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm install and run
        run: |
          npm install -g pull-pal@${{ needs.build.outputs.version }}
          pull-pal --version
          pull-pal --help
