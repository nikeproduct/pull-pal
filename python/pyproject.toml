[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pull-pal"
version = "0.2.0"
description = "Git push wrapper that auto-fetches, rebases against the default branch, and runs tests before pushing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["git", "push", "rebase", "test", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/nikeproduct/pull-pal"
Repository = "https://github.com/nikeproduct/pull-pal"

[project.scripts]
pull-pal = "pull_pal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pull_pal"]

# SHA256SUMS is generated by scripts/build.ts and is therefore git-ignored, which
# would make hatchling skip it. Without it in the wheel the launcher cannot
# verify what it downloads, so it must be listed explicitly.
[tool.hatch.build]
artifacts = ["pull_pal/SHA256SUMS"]
